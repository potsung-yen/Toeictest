<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多益單字冒險王 - TOEIC Spelling Hero</title>
    <link rel="stylesheet" href="style.css?v=999">
</head>
<body>

    <div class="container">
        <h1>🎮 多益單字冒險王</h1>
        <p class="subtitle">背單字也能像打怪一樣刺激！</p>

        <!-- 玩家設定區 -->
        <div class="card">
            <div class="input-group">
                <label for="playerName">玩家名稱：</label>
                <input type="text" id="playerName" value="冒險王" placeholder="輸入你的名字">
            </div>

            <div class="input-group">
                <label>題號範圍：從第</label>
                <input type="number" id="startIdx" value="1" min="1" style="width: 70px; text-align: center;">
                <label>題 到第</label>
                <input type="number" id="endIdx" value="30" min="1" style="width: 70px; text-align: center;">
                <label>題</label>
            </div>

            <!-- 關鍵修復：這裡直接明確呼叫 openWordSelector() -->
            <button type="button" class="btn-secondary" onclick="openWordSelector()">📋 點我選單字</button>

            <div class="input-group" style="margin-top: 15px;">
                <label for="customIdx">自訂指定題號 (例如 1, 5, 10-15)：</label>
                <input type="text" id="customIdx" placeholder="留空則照上方範圍">
            </div>

            <div class="input-group">
                <label>遊戲模式：</label>
                <label><input type="radio" name="gameMode" value="spelling" checked onchange="changeMode()"> 拼字模式</label>
                <label style="margin-left: 15px;"><input type="radio" name="gameMode" value="choice" onchange="changeMode()"> 選擇題模式</label>
            </div>

            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                <!-- 關鍵修復：明確綁定 startGame() -->
                <button type="button" class="btn-primary" onclick="startGame()">🚀 開始冒險</button>
                <button type="button" class="btn-danger" onclick="exportMistakes()">📥 下載錯題本</button>
                <button type="button" class="btn-boss" id="bossBtn" style="display:none;" onclick="startBossBattle()">👿 挑戰魔王</button>
            </div>
            
            <div style="margin-top: 10px;">
                <button type="button" class="btn-success" onclick="openPromptModal()">🤖 獲取 AI 擴充提示詞</button>
            </div>
        </div>

        <!-- 遊戲主畫面 -->
        <div id="gameArea" class="card" style="display: none;">
            <div class="score-board">
                <span>⭐ 得分：<b id="score">0</b></span>
                <button type="button" onclick="speakWord()" class="btn-small">🔊 聽發音</button>
                <button type="button" onclick="showWordInfo()" class="btn-small" style="background-color: #8e44ad;">💡 單字解析</button>
            </div>

            <div class="question-box">
                <h2 id="chineseHint" style="color: #2c3e50; margin-bottom: 5px;">中文提示</h2>
                <p id="sentenceHint" style="color: #7f8c8d; font-style: italic; display:none; margin-top: 0;"></p>
            </div>

            <!-- 拼字模式輸入區 -->
            <div id="spellingArea" class="input-group">
                <input type="text" id="englishInput" placeholder="請輸入英文單字..." autocomplete="off" autocapitalize="none" onkeydown="handleEnter(event)">
                <!-- 明確綁定 checkAnswer() -->
                <button type="button" class="btn-primary" id="submitBtn" onclick="checkAnswer()">送出答案</button>
            </div>

            <!-- 選擇題模式選項區 -->
            <div id="choiceArea" class="choice-container" style="display: none;"></div>

            <div id="feedbackMsg" class="feedback"></div>

            <div style="margin-top: 15px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;">
                <label><input type="checkbox" id="autoNext" checked> 答對自動下一題</label>
                <!-- 明確綁定 nextQuestion() -->
                <button type="button" class="btn-secondary" id="nextBtn" style="display: none;" onclick="nextQuestion()">下一題 ➔</button>
            </div>
        </div>

        <!-- 兔子小助手 -->
        <div class="bunny-container">
            <div id="bunnyAvatar" class="bunny-avatar" onclick="bunnyGreet()">
                <img id="bunnyImg" src="IMG_2597.png" alt="Bunny">
            </div>
            <div id="bunnySpeech" class="speech-bubble">哈囉！點我一下聽打氣！</div>
        </div>

        <!-- 字典查詢區 -->
        <div class="card">
            <h3>📖 單字隨查</h3>
            <div class="input-group">
                <input type="text" id="searchInput" placeholder="輸入英文或中文搜尋..." onkeydown="handleSearchEnter(event)">
                <button type="button" class="btn-primary" onclick="searchWord()">🔍 搜尋</button>
            </div>
            <div id="searchResultArea" style="display: none; margin-top: 15px;"></div>
        </div>

        <!-- CSV 生字擴充區 -->
        <div id="uploadArea" class="card">
            <h3>📂 匯入 CSV 擴充生字</h3>
            <input type="file" id="csvFile" accept=".csv" onchange="handleFileUpload(event)">
            <p id="uploadStatus" style="color: #27ae60; font-weight: bold; margin-top: 5px;"></p>
        </div>
    </div>

    <!-- 視窗：單字挑選器 -->
    <div id="wordSelectorModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>📋 選擇要練習的單字</h3>
            <div style="margin-bottom: 10px;">
                <label><input type="checkbox" onchange="toggleSelectAll(this)"> 全選 / 取消全選</label>
            </div>
            <div id="wordListContainer" style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 10px;"></div>
            <div style="text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                <button type="button" class="btn-primary" onclick="confirmWordSelection()">確定選擇</button>
                <button type="button" class="btn-danger" onclick="closeWordSelector()">取消</button>
            </div>
        </div>
    </div>

    <!-- 載入資料與遊戲主程式 -->
    <script src="words.js?v=2026"></script>
    <script src="game2.js?v=2026"></script>
</body>
</html>
